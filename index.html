<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopMaster - Python 迴圈練習實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .code-editor { font-family: 'IBM Plex Mono', monospace; }
        .animation-canvas { background: #111827; border-radius: 16px; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-zinc-800 px-8 py-6">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-blue-500 rounded-2xl flex items-center justify-center text-2xl">🔄</div>
                <h1 class="text-4xl font-bold tracking-tight">LoopMaster</h1>
                <span class="px-4 py-1 bg-blue-900 text-blue-300 text-sm font-medium rounded-3xl">for • while • continue • break</span>
            </div>
            <p class="text-zinc-400 text-lg">動畫學習 Python 迴圈 • 填空練習 • 小遊戲挑戰</p>
            <button onclick="loadPyodideAndPackages()" id="loadBtn"
                    class="px-6 py-3 bg-white text-zinc-900 rounded-3xl font-medium hover:bg-blue-400 transition-all">
                載入 Python 引擎
            </button>
        </div>

        <div class="flex h-[calc(100vh-88px)]">
            <!-- 左側導航 -->
            <div class="w-72 border-r border-zinc-800 bg-zinc-900 p-6 overflow-auto">
                <h2 class="text-blue-400 font-medium mb-4 flex items-center gap-2"><span>📌</span> 學習目標</h2>
                <ul class="space-y-4 text-sm">
                    <li class="flex gap-2"><span class="text-blue-400">•</span> <strong>for loop</strong>：迭代固定次數</li>
                    <li class="flex gap-2"><span class="text-blue-400">•</span> <strong>while loop</strong>：條件判斷持續執行</li>
                    <li class="flex gap-2"><span class="text-blue-400">•</span> <strong>continue</strong>：跳過本次迭代</li>
                    <li class="flex gap-2"><span class="text-blue-400">•</span> <strong>break</strong>：提前結束迴圈</li>
                </ul>

                <h2 class="text-blue-400 font-medium mt-10 mb-4">動畫示範</h2>
                <div onclick="startVisualizer(0)" class="cursor-pointer mb-3 p-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-sm">
                    <strong>1. for loop 迭代動畫</strong><br>
                    <span class="text-zinc-400 text-xs">變數 i 變化 + 累加器</span>
                </div>
                <div onclick="startVisualizer(1)" class="cursor-pointer mb-3 p-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-sm">
                    <strong>2. while loop + break</strong><br>
                    <span class="text-zinc-400 text-xs">猜數字遊戲流程</span>
                </div>
                <div onclick="startVisualizer(2)" class="cursor-pointer p-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-sm">
                    <strong>3. continue 跳過範例</strong><br>
                    <span class="text-zinc-400 text-xs">只印奇數</span>
                </div>
            </div>
